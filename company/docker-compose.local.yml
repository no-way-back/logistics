services:
  company-postgres:
    image: postgres:15-alpine
    container_name: company-postgres
    environment:
      POSTGRES_DB: company_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - company-postgres-data:/var/lib/postgresql/data
    networks:
      - company-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  company-service:
    build:
      context: ..
      dockerfile: company/Dockerfile
    container_name: company-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      COMPANY_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/company_db
      COMPANY_SPRING_DATASOURCE_USERNAME: user
      COMPANY_SPRING_DATASOURCE_PASSWORD: 1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
    ports:
      - "18082:18082"
    depends_on:
      company-postgres:
        condition: service_healthy
    networks:
      - company-network
    restart: unless-stopped

volumes:
  company-postgres-data:
    driver: local

networks:
  company-network:
    driver: bridge
  msa-network:
    external: true