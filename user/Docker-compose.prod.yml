services:
  user-postgres:
    image: postgres:15-alpine
    container_name: user-postgres-prod
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Seoul
    ports:
      - "${USER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - user-postgres-prod-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - user-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_POSTGRES_USER} -d ${USER_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ..
      dockerfile: user/Dockerfile
    container_name: user-service-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      USER_SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:${USER_POSTGRES_PORT}/${USER_POSTGRES_DB}
      USER_SPRING_DATASOURCE_USERNAME: ${USER_POSTGRES_USER}
      USER_SPRING_DATASOURCE_PASSWORD: ${USER_POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${USER_SERVICE_PORT:-18081}:18081"
    depends_on:
      user-postgres:
        condition: service_healthy
    networks:
      - user-network
      - msa-network
    restart: unless-stopped

volumes:
  user-postgres-prod-data:
    driver: local

networks:
  user-network:
    driver: bridge
  msa-network:
    external: true
