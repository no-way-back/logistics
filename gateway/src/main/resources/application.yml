server:
  port: 8080

spring:
  application:
    name: gateway

  profiles:
    active: local

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/hubs/**

        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/companies/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**

        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/messages/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      show-details: always