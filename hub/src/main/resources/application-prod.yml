server:
  port: 18083

spring:
  application:
    name: hub-service

  datasource:
    url: ${USER_SPRING_DATASOURCE_URL}
    username: ${USER_SPRING_DATASOURCE_USERNAME}
    password: ${USER_SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: hub_service
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    fetch-registry: true
    register-with-eureka: true

jwt:
  secret: ${JWT_SECRET}
  expiration-time: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.logistics.user: INFO