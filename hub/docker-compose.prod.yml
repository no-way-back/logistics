version: '3.8'

services:
  hub-postgres:
    image: postgres:15-alpine
    container_name: hub-postgres-prod
    environment:
      POSTGRES_DB: ${HUB_POSTGRES_DB}
      POSTGRES_USER: ${HUB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Seoul
    ports:
      - "${HUB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - hub-postgres-prod-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_POSTGRES_USER} -d ${HUB_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hub-service:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    container_name: hub-service-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      HUB_SPRING_DATASOURCE_URL: jdbc:postgresql://hub-postgres:${HUB_POSTGRES_PORT}/${HUB_POSTGRES_DB}
      HUB_SPRING_DATASOURCE_USERNAME: ${HUB_POSTGRES_USER}
      HUB_SPRING_DATASOURCE_PASSWORD: ${HUB_POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${HUB_SERVICE_PORT:-18083}:18083"
    depends_on:
      hub-postgres:
        condition: service_healthy
    networks:
      - hub-network
      - msa-network
    restart: unless-stopped

volumes:
  hub-postgres-prod-data:
    driver: local

networks:
  hub-network:
    driver: bridge
  msa-network:
    external: true