version: '3.8'

services:
  hub-postgres:
    image: postgres:15-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_DB: hub_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data
    networks:
      - hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  hub-service:
    build:
      context: ..
      dockerfile: hub/Dockerfile
      platforms:
        - linux/amd64
    container_name: hub-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      HUB_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/hub_db
      HUB_SPRING_DATASOURCE_USERNAME: user
      HUB_SPRING_DATASOURCE_PASSWORD: 1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      JWT_SECRET: local-secret
    ports:
      - "18083:18083"
    depends_on:
      hub-postgres:
        condition: service_healthy
    networks:
      - hub-network
    restart: unless-stopped

volumes:
  hub-postgres-data:
    driver: local

networks:
  hub-network:
    driver: bridge
  msa-network:
    external: true