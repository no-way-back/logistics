server:
  port: 18087

spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://logi-postgres:5432/payment_db
    username: user
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: payment_service
    show_sql: true

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: payment-service
eureka:
  client:
    enabled: false
