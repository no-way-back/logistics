server:
  port: 18087

spring:
  datasource:
    url: ${PAYMENT_SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/payment_db}
    username: ${PAYMENT_SPRING_DATASOURCE_USERNAME:user}
    password: ${PAYMENT_SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: payment_service
    show_sql: true